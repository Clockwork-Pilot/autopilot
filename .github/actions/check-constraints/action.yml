name: check-constraints
description: Run check_spec_constraints.py inside a prepared docker image. Image preparation (pull or build) is the caller's responsibility — use ensure-docker-image upstream of this step.

inputs:
  image:
    description: Local docker image ref produced by ensure-docker-image (or equivalent). Must be an autopilot-ws-compatible runtime.
    required: true
  command:
    description: Command to run inside the image. Default runs the constraint checker.
    required: false
    default: check_spec_constraints.py
  extra_docker_args:
    description: Extra args spliced into `docker run` (forwarded as EXTRA_DOCKER_ARGS).
    required: false
    default: ""

outputs:
  exit_code:
    description: Exit code of the in-container command.
    value: ${{ steps.run.outputs.exit_code }}
  body:
    description: Stdout+stderr of the in-container command (the constraint report).
    value: ${{ steps.run.outputs.body }}

runs:
  using: composite
  steps:
    - name: Run check inside image
      id: run
      shell: bash
      env:
        AGENT_IMAGE: ${{ inputs.image }}
        CMD: ${{ inputs.command }}
        EXTRA_DOCKER_ARGS: ${{ inputs.extra_docker_args }}
      run: |
        set +e
        OUT=$(mktemp)
        bash "$GITHUB_ACTION_PATH/../../scripts/run-in-docker-no-agent.sh" "$CMD" > "$OUT" 2>&1
        EXIT_CODE=$?
        cat "$OUT"
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        {
          echo "body<<EOF_CONSTRAINTS_BODY"
          cat "$OUT"
          echo "EOF_CONSTRAINTS_BODY"
        } >> "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"
