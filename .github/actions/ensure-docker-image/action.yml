name: Ensure Docker Image
description: |
  Dispatcher: routes to ensure-image-hosted or ensure-image-local based on the
  runner type. The two leaf actions have very different caching strategies
  (GHA caches vs. daemon layer cache) and a unified action used to switch
  internally; splitting cleaned that up. Inputs/outputs preserved for callers.

  Prefer calling the leaf actions directly when the caller's runner type is
  static (which is almost always). Use this dispatcher only when a single
  caller may run on either runner type.

inputs:
  dockerfile:
    description: Path to the Dockerfile, relative to $GITHUB_WORKSPACE. Leave empty to only pull+tag `base_image`.
    required: false
    default: ""
  context:
    description: Build context directory, relative to $GITHUB_WORKSPACE. Only used when `dockerfile` is set.
    required: false
    default: "."
  build_args:
    description: Newline-separated KEY=VALUE build args, forwarded to the builder.
    required: false
    default: ""
  base_image:
    description: Image reference to pull and tag locally, and the FROM contract for any Dockerfile.
    required: true
  tag_prefix:
    description: REQUIRED. Project namespace. See ensure-image-hosted / ensure-image-local for details.
    required: true

outputs:
  image:
    description: Fully qualified local tag of the produced image.
    value: ${{ steps.hosted.outputs.image || steps.local.outputs.image }}
  cache_hit:
    description: '"true" if the local tag pre-existed and neither build nor pull ran.'
    value: ${{ steps.hosted.outputs.cache_hit || steps.local.outputs.cache_hit }}
  digest:
    description: Local image ID (sha256) of the produced image.
    value: ${{ steps.hosted.outputs.digest || steps.local.outputs.digest }}

runs:
  using: composite
  steps:
    - id: hosted
      if: runner.environment != 'self-hosted'
      uses: Clockwork-Pilot/autopilot/.github/actions/ensure-image-hosted@main
      with:
        dockerfile: ${{ inputs.dockerfile }}
        context:    ${{ inputs.context }}
        build_args: ${{ inputs.build_args }}
        base_image: ${{ inputs.base_image }}
        tag_prefix: ${{ inputs.tag_prefix }}

    - id: local
      if: runner.environment == 'self-hosted'
      uses: Clockwork-Pilot/autopilot/.github/actions/ensure-image-local@main
      with:
        dockerfile: ${{ inputs.dockerfile }}
        context:    ${{ inputs.context }}
        build_args: ${{ inputs.build_args }}
        base_image: ${{ inputs.base_image }}
        tag_prefix: ${{ inputs.tag_prefix }}
